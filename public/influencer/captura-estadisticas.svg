<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <!-- Captura de ejemplo de unas estadísticas de una publicación: cifras inventadas, sin marca real. -->
  <rect width="360" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="360" height="44" fill="#f4f4f5"/>
  <text x="20" y="28" font-size="14" font-weight="600" fill="#18181b">Estadísticas</text>
  <rect x="20" y="64" width="64" height="96" rx="8" fill="#e4e4e7"/>
  <text x="100" y="84" font-size="12" fill="#71717a">Publicado el 2 oct</text>
  <text x="100" y="106" font-size="13" font-weight="600" fill="#18181b">Tutorial en 30 segundos</text>
  <g font-size="12" fill="#71717a">
    <text x="20" y="200">Visualizaciones</text><text x="340" y="200" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">52,3 mil</text>
    <text x="20" y="240">Cuentas alcanzadas</text><text x="340" y="240" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">41,8 mil</text>
    <text x="20" y="280">Me gusta</text><text x="340" y="280" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">3.900</text>
    <text x="20" y="320">Comentarios</text><text x="340" y="320" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">214</text>
    <text x="20" y="360">Guardados</text><text x="340" y="360" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">860</text>
    <text x="20" y="400">Compartidos</text><text x="340" y="400" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">312</text>
    <text x="20" y="440">Clics en el enlace</text><text x="340" y="440" text-anchor="end" font-size="16" font-weight="700" fill="#18181b">640</text>
  </g>
  <g fill="#6366f1">
    <rect x="20" y="490" width="30" height="80" rx="4" opacity="0.35"/><rect x="60" y="470" width="30" height="100" rx="4" opacity="0.5"/>
    <rect x="100" y="455" width="30" height="115" rx="4" opacity="0.7"/><rect x="140" y="480" width="30" height="90" rx="4" opacity="0.5"/>
    <rect x="180" y="500" width="30" height="70" rx="4" opacity="0.4"/><rect x="220" y="510" width="30" height="60" rx="4" opacity="0.3"/>
    <rect x="260" y="520" width="30" height="50" rx="4" opacity="0.25"/><rect x="300" y="530" width="30" height="40" rx="4" opacity="0.2"/>
  </g>
  <text x="20" y="600" font-size="11" fill="#a1a1aa">Visualizaciones por día</text>
</svg>
