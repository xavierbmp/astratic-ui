<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <!-- Captura de ejemplo de la audiencia de una publicación: cifras inventadas, sin marca real. -->
  <rect width="360" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="360" height="44" fill="#f4f4f5"/>
  <text x="20" y="28" font-size="14" font-weight="600" fill="#18181b">Audiencia</text>
  <text x="20" y="84" font-size="12" fill="#71717a">Ciudades principales</text>
  <g font-size="13" fill="#18181b">
    <text x="20" y="118">Madrid</text><rect x="120" y="108" width="190" height="10" rx="5" fill="#e4e4e7"/><rect x="120" y="108" width="120" height="10" rx="5" fill="#6366f1"/>
    <text x="20" y="148">Barcelona</text><rect x="120" y="138" width="190" height="10" rx="5" fill="#e4e4e7"/><rect x="120" y="138" width="86" height="10" rx="5" fill="#6366f1"/>
    <text x="20" y="178">Valencia</text><rect x="120" y="168" width="190" height="10" rx="5" fill="#e4e4e7"/><rect x="120" y="168" width="64" height="10" rx="5" fill="#6366f1"/>
    <text x="20" y="208">Sevilla</text><rect x="120" y="198" width="190" height="10" rx="5" fill="#e4e4e7"/><rect x="120" y="198" width="38" height="10" rx="5" fill="#6366f1"/>
  </g>
  <text x="20" y="262" font-size="12" fill="#71717a">Edad</text>
  <g fill="#6366f1">
    <rect x="30" y="400" width="40" height="40" rx="4" opacity="0.4"/><rect x="90" y="300" width="40" height="140" rx="4"/>
    <rect x="150" y="330" width="40" height="110" rx="4" opacity="0.8"/><rect x="210" y="380" width="40" height="60" rx="4" opacity="0.5"/>
    <rect x="270" y="410" width="40" height="30" rx="4" opacity="0.3"/>
  </g>
  <g font-size="11" fill="#71717a" text-anchor="middle">
    <text x="50" y="460">18–24</text><text x="110" y="460">25–34</text><text x="170" y="460">35–44</text><text x="230" y="460">45–54</text><text x="290" y="460">55+</text>
  </g>
  <text x="20" y="510" font-size="12" fill="#71717a">Género</text>
  <rect x="20" y="526" width="320" height="14" rx="7" fill="#e4e4e7"/><rect x="20" y="526" width="275" height="14" rx="7" fill="#6366f1"/>
  <text x="20" y="562" font-size="12" fill="#18181b">Mujeres 86 %</text><text x="340" y="562" font-size="12" text-anchor="end" fill="#18181b">Hombres 14 %</text>
</svg>
